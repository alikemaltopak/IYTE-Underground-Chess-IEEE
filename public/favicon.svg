<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Arka plan Siyah (Siyah Kareler) -->
  <rect x="0" y="0" width="100" height="100" fill="#000000" />
  
  <!-- Beyaz Kareler (4x4 Satranç Tahtası) -->
  <rect x="0" y="0" width="25" height="25" fill="#ffffff" />
  <rect x="50" y="0" width="25" height="25" fill="#ffffff" />
  <rect x="25" y="25" width="25" height="25" fill="#ffffff" />
  <rect x="75" y="25" width="25" height="25" fill="#ffffff" />
  <rect x="0" y="50" width="25" height="25" fill="#ffffff" />
  <rect x="50" y="50" width="25" height="25" fill="#ffffff" />
  <rect x="25" y="75" width="25" height="25" fill="#ffffff" />
  <rect x="75" y="75" width="25" height="25" fill="#ffffff" />

  <!-- Maske Gövdesi Arkasındaki İnce Siyah Gölge (Daha iyi görünmesi için) -->
  <circle cx="50" cy="50" r="40" fill="#000000" opacity="0.6" />

  <!-- Sitede kullanılan "VenetianMask" İkonu (Lucide-React) -->
  <!-- 24x24 ikon viewBox'unu 100x100 içine tam oturtmak ve ortalamak için scale ve translate kullanıyoruz. -->
  <g transform="scale(3.333) translate(3, 3)" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 11c-1.5 0-2.5.5-3 2" />
    <path d="M4 6a2 2 0 0 0-2 2v4a5 5 0 0 0 5 5 8 8 0 0 1 5 2 8 8 0 0 1 5-2 5 5 0 0 0 5-5V8a2 2 0 0 0-2-2h-3a8 8 0 0 0-5 2 8 8 0 0 0-5-2z" />
    <path d="M6 11c1.5 0 2.5.5 3 2" />
  </g>
</svg>
